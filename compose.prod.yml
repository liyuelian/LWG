# ============================================================================
# LWG 灵务阁 · 生产部署覆盖文件（服务器上使用）
#
# 用法：
#   docker compose -f compose.yml -f compose.prod.yml up -d
#
# 与基础文件的三点差别：
#   1. 镜像来自 CI 推送到 ghcr.io 的产物。基础文件默认的本地 tag
#      （lwg-backend:local / lwg-frontend:local）在服务器上并不存在。
#   2. tag 使用具体的 commit sha（不可变），而不是浮动的 latest，
#      这样回滚只需换回上一个 sha，行为可预期。
#   3. pull_policy: always 保证每次都真正去仓库取指定 tag，
#      避免本地缓存了旧镜像却以为部署成功。
#
# 由 deploy.sh 注入的变量：
#   BACKEND_IMAGE   ghcr.io/liyuelian/lwg-backend:<sha>
#   FRONTEND_IMAGE  ghcr.io/liyuelian/lwg-frontend:<sha>
# 两者都没有默认值：缺失时 compose 直接报错，避免误用本地 tag 起一个旧容器。
# ============================================================================

services:

  lwg-backend:
    image: ${BACKEND_IMAGE:?生产部署必须指定 BACKEND_IMAGE，形如 ghcr.io/<owner>/lwg-backend:<sha>}
    pull_policy: always
    environment:
      # 服务器内存仅 1.6G，收紧堆与元空间上限，并在 OOM 时快速退出交由 restart 策略处理
      JAVA_OPTS: "-XX:MaxRAMPercentage=70 -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError -Djava.net.preferIPv4Stack=true -Duser.timezone=Asia/Shanghai"

  lwg-frontend:
    image: ${FRONTEND_IMAGE:?生产部署必须指定 FRONTEND_IMAGE，形如 ghcr.io/<owner>/lwg-frontend:<sha>}
    pull_policy: always
