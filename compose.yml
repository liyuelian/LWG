# ============================================================================
# LWG 灵务阁 · 容器编排（基础文件：只描述「怎么跑」）
#
# 本文件刻意不写 build，只引用镜像；镜像从哪来由各环境用覆盖文件决定：
#   本地开发  docker compose -f compose.yml -f compose.build.yml up -d --build
#              （compose.build.yml 补上两个服务的 build 上下文，前端指向 ../lwg-ui）
#   生产部署  docker compose -f compose.yml -f compose.prod.yml up -d
#              （compose.prod.yml 指定 CI 推送到 ghcr.io 的不可变 tag 镜像）
# 这样服务器上永远不会尝试本地构建——它上面也没有前端源码。
#
# 设计要点：
#   1. 所有服务接入同一个 bridge 网络 lwg，容器之间用服务名互相解析。
#      这也是生产形态：application-prod.yml 里的 DB_HOST/RABBITMQ_HOST
#      默认就是 lwg-mysql / lwg-rabbitmq。
#   2. mysql 与 rabbitmq 使用外部容器加入网络而非在此定义——
#      数据卷与现有数据完全不受编排影响，避免误删开发数据。
#      首次使用需执行一次接入命令：
#        docker network create lwg
#        docker network connect --alias lwg-mysql lwg mysql
#        docker network connect --alias lwg-rabbitmq lwg rabbitmq
#   3. 后端 8080 只绑定 127.0.0.1，仅站点端口对外，与生产暴露策略一致。
#   4. lwg-frontend 是唯一对外的入口，同时承担 /api 反向代理。
#
# 对外端口由 .env 的 FRONTEND_PORT 控制，默认 8081。
# ============================================================================

name: lwg

services:

  # ---- 后端 ----
  lwg-backend:
    image: ${BACKEND_IMAGE:-lwg-backend:local}
    container_name: lwg-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 主机名固定用服务名，容器里的 localhost 不是数据库
      DB_HOST: lwg-mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-lwg}
      DB_USERNAME: ${DB_USERNAME:?请在 .env 中设置 DB_USERNAME（可参考 .env.example）}
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD（可参考 .env.example）}
      RABBITMQ_HOST: lwg-rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?请在 .env 中设置 RABBITMQ_PASSWORD}
      # 两个数据服务需先接入 lwg 网络（见文件头注释）
      JAVA_OPTS: "-XX:MaxRAMPercentage=75 -XX:+UseSerialGC -Djava.net.preferIPv4Stack=true -Duser.timezone=Asia/Shanghai"
    ports:
      # 只绑本机回环：后端不对公网暴露，仅 lwg-frontend 可经内网访问
      - "127.0.0.1:8080:8080"
    networks:
      - lwg
    deploy:
      resources:
        limits:
          memory: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---- 前端（唯一对外入口，兼 /api 反向代理）----
  lwg-frontend:
    image: ${FRONTEND_IMAGE:-lwg-frontend:local}
    container_name: lwg-frontend
    restart: unless-stopped
    environment:
      # nginx 模板变量：容器内用服务名解析后端，不能用 localhost
      LWG_BACKEND_HOST: lwg-backend
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    networks:
      - lwg
    depends_on:
      lwg-backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---- 以下两个仅用于「把已有容器接入本网络」的声明式写法，
  #      默认放在 profiles 里不启动；如需 compose 代为创建全新数据服务，
  #      用 --profile provision 并注意会初始化空库（现有数据在旧容器中）。
  lwg-mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    container_name: lwg-mysql
    profiles: ["provision"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?}
      MYSQL_DATABASE: ${DB_NAME:-lwg}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --max-connections=30
    volumes:
      - lwg-mysql-data:/var/lib/mysql
    networks:
      - lwg
    deploy:
      resources:
        limits:
          memory: 320m

  lwg-rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:3.13}
    container_name: lwg-rabbitmq
    profiles: ["provision"]
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?}
      # 关闭管理插件：省下约 100MB 内存，本机/小内存服务器上收益明显
      RABBITMQ_MANAGEMENT_ENABLED: "false"
    volumes:
      - lwg-rabbitmq-data:/var/lib/rabbitmq
    networks:
      - lwg
    deploy:
      resources:
        limits:
          memory: 192m

networks:
  lwg:
    name: lwg
    driver: bridge

volumes:
  lwg-mysql-data:
  lwg-rabbitmq-data:
